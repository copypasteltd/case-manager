plugins { id 'java' }
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
sourceSets {
    main {
        java.srcDir '../../android/app/src/main/java'
        java.include 'hk/copypaste/workspace/ApiHTTP.java', 'hk/copypaste/workspace/ReadCache.java',
            'hk/copypaste/workspace/UploadLayout.java', 'hk/copypaste/workspace/UploadSource.java',
            'hk/copypaste/workspace/UploadPermit.java', 'hk/copypaste/workspace/UploadTransfer.java'
    }
    test { java.srcDir '../../android/app/src/test/java' }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.2'
    testImplementation 'junit:junit:4.13.2'
}
test {
    maxParallelForks = 1
    testLogging { events 'failed'; exceptionFormat 'full' }
}
